type Profile @table(key: "id") {
  id: String! @default(expr: "auth.uid")
  role: String! @default(value: "student")
  displayName: String!
  email: String! @unique
  university: String
  faculty: String
  grade: String
  bio: String
  skills: [String!]! @default(sql: "'{}'::text[]")
  privacyAgreedAt: Timestamp! @default(expr: "request.time")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Wish
  @table
  @index(fields: ["status", "createdAt"], order: [ASC, DESC]) {
  ownerId: String! @index
  owner: Profile! @ref(fields: ["ownerId"], references: ["id"])
  shopName: String!
  contactName: String!
  contactEmail: String!
  industry: String!
  websiteUrl: String
  snsUrl: String
  address: String
  problem: String!
  desiredOutcome: String!
  experimentIdea: String
  preferredPeriod: String
  notes: String
  status: String! @default(value: "submitted")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Challenge
  @table
  @index(fields: ["status", "publishedAt"], order: [ASC, DESC]) {
  wishId: UUID @index
  wish: Wish @ref(fields: ["wishId"], references: ["id"])
  title: String!
  summary: String!
  background: String!
  problem: String!
  desiredOutcome: String!
  shopDisplayName: String!
  category: String!
  skills: [String!]! @default(sql: "'{}'::text[]")
  period: String
  workload: String
  area: String!
  capacity: Int! @default(value: 1)
  deadline: Timestamp
  status: String! @default(value: "draft")
  isSample: Boolean! @default(value: false)
  # Only administrators may approve a separately reviewed public location.
  # Private WISH.address must NEVER be copied here automatically.
  mapLatitude: Float
  mapLongitude: Float
  mapLabel: String
  mapPrecision: String
  mapApproved: Boolean! @default(value: false)
  publishedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Application
  @table
  @unique(fields: ["challengeId", "studentId"])
  @index(fields: ["studentId", "createdAt"], order: [ASC, DESC])
  @index(fields: ["challengeId", "status"], order: [ASC, ASC]) {
  challengeId: UUID!
  challenge: Challenge! @ref(fields: ["challengeId"], references: ["id"])
  studentId: String!
  student: Profile! @ref(fields: ["studentId"], references: ["id"])
  motivation: String!
  interestReason: String!
  skillsExperience: String!
  availability: String!
  notes: String
  status: String! @default(value: "applied")
  privacyAgreedAt: Timestamp! @default(expr: "request.time")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Private project handoff after a verified match; never a public map/API resource.
type LabProject
  @table
  @index(fields: ["status", "createdAt"], order: [ASC, DESC]) {
  applicationId: UUID! @unique
  application: Application! @ref(fields: ["applicationId"], references: ["id"])
  challengeId: UUID! @index
  challenge: Challenge! @ref(fields: ["challengeId"], references: ["id"])
  studentId: String! @index
  student: Profile! @ref(fields: ["studentId"], references: ["id"])
  ownerId: String! @index
  owner: Profile! @ref(fields: ["ownerId"], references: ["id"])
  goal: String!
  baselineNote: String
  status: String! @default(value: "planning")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Admin-only, first-party metrics. No public data, no implicit publication.
type LabMetric
  @table
  @unique(fields: ["projectId", "name"]) {
  projectId: UUID! @index
  project: LabProject! @ref(fields: ["projectId"], references: ["id"])
  name: String!
  unit: String!
  direction: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Append-only measurements for auditable descriptive comparisons.
type LabObservation
  @table
  @index(fields: ["projectId", "measuredAt"], order: [ASC, DESC]) {
  projectId: UUID! @index
  project: LabProject! @ref(fields: ["projectId"], references: ["id"])
  metricId: UUID! @index
  metric: LabMetric! @ref(fields: ["metricId"], references: ["id"])
  phase: String!
  value: Float!
  windowDays: Int!
  methodNote: String!
  evidenceUrl: String
  contextNote: String
  measuredAt: Timestamp!
  createdAt: Timestamp! @default(expr: "request.time")
}
